<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bass Tuner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bass Tuner">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#111; --card:#1c1c1c; --line:#2c2c2c; --text:#f2ede6; --dim:#8a837b; --good:#3ddc84; --warn:#ffb02e; --bad:#ff5a4e; --blue:#5aa9ff; --purple:#b38cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; }
  button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; }
  button:active { transform:scale(.98); }
  .primary { background:var(--good); color:#111; border:0; font-weight:700; border-radius:40px; padding:16px 20px; font-size:19px; width:100%; }
  .link { background:none; border:0; color:var(--good); padding:6px 0; text-decoration:underline; }
  .view { flex:1; min-height:0; overflow-y:auto; display:none; padding:calc(env(safe-area-inset-top) + 14px) 16px 16px; }
  .view.on { display:flex; flex-direction:column; }
  .wrap { width:100%; max-width:440px; margin:0 auto; display:flex; flex-direction:column; flex:1; }
  .small { font-size:14px; color:var(--dim); }
  h1 { font-size:26px; margin:2px 0 12px; }
  h2 { font-size:21px; margin:2px 0 6px; }
  .card { background:var(--card); border-radius:16px; padding:14px; margin:10px 0; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
  .chip { background:#22303a; color:#9fd0ff; border-radius:10px; padding:5px 10px; font-size:14px; }
  .chip.g { background:#1f3528; color:#8fe8b4; }
  .rows div { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:17px; }
  .rows div:last-child { border:0; }
  .tick { color:var(--good); }

  /* tabs */
  .tabs { display:flex; border-top:1px solid var(--line); background:#151515; padding:6px 0 calc(env(safe-area-inset-bottom) + 6px); }
  .tabs button { flex:1; background:none; border:0; border-radius:0; color:var(--dim); font-size:13px; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tabs button svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .tabs button.on { color:var(--good); }

  /* tuner */
  #tune { align-items:center; position:relative; }
  .readout { width:100%; max-width:420px; text-align:center; }
  .note { font-size:92px; font-weight:700; line-height:1; height:96px; transition:color .15s; }
  .note.good { color:var(--good); } .note.warn { color:var(--warn); } .note.bad { color:var(--bad); }
  .hint { font-size:22px; font-weight:600; height:30px; margin-top:6px; color:var(--dim); }
  .hint.good { color:var(--good); }
  .meter { position:relative; height:54px; margin:16px 8px 0; }
  .scale { position:absolute; inset:22px 0 auto 0; height:10px; border-radius:5px; opacity:.35;
    background:linear-gradient(90deg, var(--bad) 0%, var(--warn) 30%, var(--good) 47%, var(--good) 53%, var(--warn) 70%, var(--bad) 100%); }
  .center { position:absolute; left:50%; top:12px; width:2px; height:30px; margin-left:-1px; background:var(--text); opacity:.6; }
  .needle { position:absolute; left:50%; top:4px; width:6px; height:46px; margin-left:-3px; border-radius:3px; background:var(--text); transition:left .12s linear, background .15s, opacity .3s; opacity:.25; }
  .needle.on { opacity:1; } .needle.good { background:var(--good); box-shadow:0 0 14px var(--good); }
  .labels { display:flex; justify-content:space-between; font-size:13px; color:var(--dim); margin:0 8px; }
  .head { flex:1; width:100%; max-width:420px; min-height:0; display:flex; align-items:flex-end; justify-content:center; margin-top:8px; }
  .head svg { width:100%; height:100%; max-height:440px; }
  .peg { cursor:pointer; }
  .peg .knob { fill:#c9c2b8; stroke:#6f675f; stroke-width:2; transition:fill .15s; }
  .peg text { font-size:30px; font-weight:700; fill:#1a1a1a; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .peg.sel .knob { fill:#fff; stroke:#fff; stroke-width:4; }
  .peg.good .knob { fill:var(--good); stroke:var(--good); }
  .string { stroke:#b8b2aa; stroke-linecap:round; transition:stroke .15s; }
  .string.sel { stroke:#fff; } .string.good { stroke:var(--good); }
  .mode { margin-top:6px; font-size:15px; color:var(--dim); height:20px; }
  .mode b { color:var(--text); }
  .start { position:absolute; inset:0; background:rgba(10,10,10,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:5; padding:24px; text-align:center; }
  .start p { color:var(--dim); margin:0; font-size:16px; max-width:300px; }
  .start .primary { width:auto; padding:18px 44px; font-size:22px; }
  .hidden { display:none !important; }

  /* session */
  .bar { display:flex; gap:5px; margin-bottom:10px; }
  .bar span { flex:1; height:5px; border-radius:3px; background:var(--line); }
  .bar span.done { background:var(--good); } .bar span.now { background:#2f7d52; }
  .timer { font-size:54px; font-weight:700; text-align:center; margin:4px 0; font-variant-numeric:tabular-nums; }
  .timer.paused { color:var(--dim); }
  .stage { flex:1; }
  .controls { display:flex; gap:10px; margin-top:12px; }
  .controls .pause { flex:2; font-size:20px; font-weight:700; padding:18px; border-radius:40px; background:#2a2a2a; }
  .controls .skip { flex:1; border-radius:40px; color:var(--dim); }
  .tempo { display:flex; align-items:center; justify-content:center; gap:14px; margin:10px 0; }
  .tempo button { width:52px; height:44px; padding:0; font-size:24px; border-radius:12px; }
  .tempo b { min-width:90px; text-align:center; font-size:18px; }
  .tip { font-size:15px; color:#c9c2b8; line-height:1.4; margin:8px 0; }

  /* tab notation */
  .tabn { font-family:ui-monospace, Menlo, monospace; background:#181818; border-radius:12px; padding:10px 8px; overflow:hidden; }
  .tabn .r { display:flex; align-items:center; height:28px; position:relative; }
  .tabn .r:before { content:""; position:absolute; left:22px; right:0; top:50%; height:1px; background:#555; }
  .tabn .sn { width:22px; color:var(--dim); font-size:13px; }
  .tabn .c { flex:1; text-align:center; position:relative; z-index:1; font-size:17px; }
  .tabn .c i { font-style:normal; background:#181818; padding:0 3px; border-radius:6px; }
  .tabn .c.cur i { background:var(--good); color:#111; font-weight:700; }
  .tabn .cnt { display:flex; height:22px; color:var(--dim); font-size:13px; }
  .tabn .cnt .c { font-size:13px; }
  .tabn .cnt .c.cur { color:var(--good); }

  /* groove / builder */
  .chord { text-align:center; margin:4px 0; }
  .chord .now { font-size:64px; font-weight:700; line-height:1.1; }
  .chord .nx { color:var(--dim); font-size:17px; }
  .beats { display:flex; justify-content:center; gap:12px; margin:8px 0; }
  .beats span { width:16px; height:16px; border-radius:50%; background:var(--line); }
  .beats span.on { background:var(--text); }
  .beats .kick { width:16px; height:16px; margin-left:12px; border-radius:4px; background:var(--line); transition:background .05s; }
  .beats .kick.on { background:var(--warn); }
  .cue { text-align:center; font-weight:700; font-size:18px; color:#111; background:var(--purple); border-radius:12px; padding:8px; margin:6px 0; visibility:hidden; }
  .cue.on { visibility:visible; }
  .fb { display:grid; grid-template-columns:16px repeat(13, 1fr); gap:2px; margin-top:6px; }
  .fb div { height:26px; border-radius:5px; background:#202020; font-size:11px; display:flex; align-items:center; justify-content:center; color:#6a6560; letter-spacing:-0.3px; }
  .fb .lab { background:none; color:var(--dim); }
  .fb .mk { color:var(--text); font-weight:700; }
  .fb .R { background:var(--good); color:#111; font-weight:700; }
  .fb .T { background:var(--warn); color:#111; font-weight:700; }
  .fb .F { background:var(--blue); color:#111; font-weight:700; }
  .fb .A { background:var(--purple); color:#111; font-weight:700; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .lvl { display:flex; gap:8px; margin-top:10px; }
  .lvl button { flex:1; border-radius:30px; }
  .lvl .got { background:#1f3528; color:var(--good); border-color:#2f5a3e; font-weight:700; }

  /* quiz */
  .ask { font-size:30px; font-weight:700; text-align:center; margin:18px 0 6px; line-height:1.25; }
  .ask b { color:var(--good); font-size:40px; }
  .heard { text-align:center; font-size:20px; min-height:30px; color:var(--dim); margin:10px 0; }
  .heard.ok { color:var(--good); font-weight:700; }

  /* progress */
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .m { background:var(--card); border-radius:14px; padding:12px; }
  .m .k { font-size:13px; color:var(--dim); } .m .v { font-size:26px; font-weight:700; margin-top:2px; }
  .chart { display:flex; align-items:flex-end; gap:8px; height:130px; margin-top:8px; }
  .chart div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:12px; color:var(--dim); gap:4px; }
  .chart i { display:block; width:100%; background:var(--good); border-radius:5px; min-height:3px; }
  .chart i.z { background:var(--line); }
  details { background:var(--card); border-radius:14px; padding:12px 14px; margin-top:14px; }
  summary { font-weight:600; }
  ol { padding-left:20px; line-height:1.6; color:#c9c2b8; }
</style>
</head>
<body>

<!-- TUNE -->
<section class="view on" id="tune">
  <div class="readout">
    <div class="note" id="note">–</div>
    <div class="hint" id="hint">Pluck a string</div>
    <div class="meter"><div class="scale"></div><div class="center"></div><div class="needle" id="needle"></div></div>
    <div class="labels"><span>♭ low</span><span>high ♯</span></div>
  </div>
  <div class="head">
    <svg viewBox="0 0 320 440" aria-label="Bass headstock">
      <defs><linearGradient id="wood" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3b2a20"/><stop offset="1" stop-color="#241912"/></linearGradient></defs>
      <path d="M125 440 L125 372 C118 340 92 320 88 280 L80 110 C78 60 110 28 160 22 C210 28 242 60 240 110 L232 280 C228 320 202 340 195 372 L195 440 Z" fill="url(#wood)" stroke="#5a4334" stroke-width="2"/>
      <rect x="123" y="366" width="74" height="8" rx="2" fill="#e8e0d0"/>
      <g stroke="#9a938a" stroke-width="8" stroke-linecap="round">
        <line x1="44" y1="140" x2="112" y2="140"/><line x1="44" y1="260" x2="116" y2="260"/>
        <line x1="208" y1="140" x2="276" y2="140"/><line x1="204" y1="260" x2="276" y2="260"/>
      </g>
      <line class="string" data-s="0" x1="134" y1="370" x2="116" y2="260" stroke-width="5"/>
      <line class="string" data-s="1" x1="152" y1="370" x2="112" y2="140" stroke-width="4"/>
      <line class="string" data-s="2" x1="168" y1="370" x2="208" y2="140" stroke-width="3.2"/>
      <line class="string" data-s="3" x1="186" y1="370" x2="204" y2="260" stroke-width="2.6"/>
      <g fill="#d8d2c8" stroke="#7a736b" stroke-width="2">
        <circle cx="112" cy="140" r="9"/><circle cx="116" cy="260" r="9"/><circle cx="208" cy="140" r="9"/><circle cx="204" cy="260" r="9"/>
      </g>
      <g class="peg" data-s="1"><ellipse class="knob" cx="34" cy="140" rx="28" ry="34"/><text x="34" y="140">A</text></g>
      <g class="peg" data-s="0"><ellipse class="knob" cx="34" cy="260" rx="28" ry="34"/><text x="34" y="260">E</text></g>
      <g class="peg" data-s="2"><ellipse class="knob" cx="286" cy="140" rx="28" ry="34"/><text x="286" y="140">D</text></g>
      <g class="peg" data-s="3"><ellipse class="knob" cx="286" cy="260" rx="28" ry="34"/><text x="286" y="260">G</text></g>
    </svg>
  </div>
  <div class="mode" id="mode"><b>Auto</b> · tap a peg to lock a string</div>
  <div class="start" id="start">
    <button class="primary" id="go">Start tuning</button>
    <p id="startMsg">Allow the microphone so the tuner can hear your bass.</p>
  </div>
</section>

<!-- PRACTICE -->
<section class="view" id="practice"><div class="wrap" id="pwrap"></div></section>

<!-- PROGRESS -->
<section class="view" id="progress"><div class="wrap" id="gwrap"></div></section>

<nav class="tabs">
  <button data-v="tune" class="on"><svg viewBox="0 0 24 24"><path d="M4 18 L12 4 L20 18"/><path d="M12 4 V20"/></svg>Tune</button>
  <button data-v="practice"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8 L16 12 L10 16 Z"/></svg>Practice</button>
  <button data-v="progress"><svg viewBox="0 0 24 24"><path d="M5 20 V12"/><path d="M12 20 V5"/><path d="M19 20 V9"/></svg>Progress</button>
</nav>

<script src="data.js"></script>
<script src="phrases.js"></script>
<script src="phrases2.js"></script>
<script src="song.js"></script>
<script src="app.js"></script>
</body>
</html>
